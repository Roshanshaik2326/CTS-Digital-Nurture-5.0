<h1>{{ portalName }}</h1>

<p>Manage your courses, enrollments and student profile.</p>

<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<hr>

<label>Search Course:</label>

<input
  type="text"
  [(ngModel)]="searchTerm"
  placeholder="Enter course name">

<p>Searching for: {{ searchTerm }}</p>

<hr>

<app-course-card
  [courseName]="selectedCourse"
  (enroll)="onCourseEnroll()">
</app-course-card>
